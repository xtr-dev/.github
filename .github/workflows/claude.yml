# @claude on issues and pull requests, restricted to an explicit list of accounts.
#
# The job gets a write token and the CLAUDE_CODE_OAUTH_TOKEN, so only the
# accounts in `allowed-actors` can start it; a mention from anyone else is
# ignored before a runner is allocated.
name: Claude

on:
  workflow_call:
    inputs:
      allowed-actors:
        description: JSON array of GitHub logins that may trigger @claude.
        type: string
        default: '["bvdaakster","xtr-bas"]'
      allowed-tools:
        description: Extra Claude Code --allowedTools entries (comma separated).
        type: string
        default: 'Bash(pnpm install),Bash(pnpm build),Bash(pnpm build:*),Bash(pnpm lint),Bash(pnpm lint:*),Bash(pnpm test),Bash(pnpm test:*),Bash(pnpm typecheck),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)'
      model:
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      contains(fromJSON(inputs.allowed-actors), github.actor) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      # Dependencies are installed up front so Claude can build and test.
      # Lockfile drift should not stop Claude from answering.
      - name: Install dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ inputs.model }} --allowedTools "${{ inputs.allowed-tools }}"
